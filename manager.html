<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор КП — ТОО «Мамыр»</title>
    <style>
        * { box-sizing: border-box; font-family: 'Calibri', 'Arial', sans-serif; }
        body { background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #1a365d; font-size: 22px; margin-top: 0; border-bottom: 2px solid #2b6cb0; padding-bottom: 10px; }
        .section-title { font-size: 16px; color: #2b6cb0; margin-top: 20px; margin-bottom: 10px; font-weight: bold; }
        
        .panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .control-group label { display: block; font-weight: bold; font-size: 13px; color: #2d3748; margin-bottom: 6px; }
        .control-group select, .control-group input { width: 100%; padding: 9px 12px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 6px; background: #fff; }
        
        .btn { background: #2b6cb0; color: #fff; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background: #2c5282; }
    </style>
</head>
<body>

<div class="container">
    <h1>Генератор Коммерческих Предложений M-CONSTRUCTION</h1>

    <div class="section-title">1. Ответственный сотрудник и заказчик</div>
    <div class="panel">
        <div class="control-group">
            <label for="managerSelect">Ответственное лицо:</label>
            <select id="managerSelect">
                <option value="manager1">Менеджер 1</option>
                <option value="manager2">Менеджер 2</option>
            </select>
        </div>
        <div class="control-group">
            <label for="clientName">Заказчик (ТОО / ИП / ФИО):</label>
            <input type="text" id="clientName" value="ТОО «Мамыр»" placeholder="Введите заказчика">
        </div>
        <div class="control-group">
            <label for="clientPhone">Контактный телефон:</label>
            <input type="text" id="clientPhone" value="+7 700 000 00 00">
        </div>
        <div class="control-group">
            <label for="objectType">Назначение объекта:</label>
            <input type="text" id="objectType" value="Зернохранилище">
        </div>
    </div>

    <div class="section-title">2. Конструкция и габариты</div>
    <div class="panel">
        <div class="control-group">
            <label for="buildingType">Тип здания:</label>
            <select id="buildingType">
                <option value="Арочный холодный (Тент ПВХ)">Арочный холодный (Тент ПВХ)</option>
                <option value="Прямостенный арочный">Прямостенный арочный</option>
            </select>
        </div>
        <div class="control-group">
            <label for="width">Ширина (м):</label>
            <input type="number" id="width" value="18">
        </div>
        <div class="control-group">
            <label for="length">Длина (м):</label>
            <input type="number" id="length" value="36">
        </div>
        <div class="control-group">
            <label for="amount">Итоговая стоимость (₸):</label>
            <input type="text" id="amount" value="6 500 000 ₸">
        </div>
    </div>

    <button class="btn" onclick="generateAndSaveKP()">Сформировать КП и сохранить в кабинет менеджера</button>
</div>

<script>
    function generateAndSaveKP() {
        var managerId = document.getElementById('managerSelect').value; // manager1 или manager2
        var client = document.getElementById('clientName').value;
        var phone = document.getElementById('clientPhone').value;
        var object = document.getElementById('objectType').value;
        var bType = document.getElementById('buildingType').value;
        var w = document.getElementById('width').value;
        var l = document.getElementById('length').value;
        var price = document.getElementById('amount').value;

        var newDeal = {
            id: Date.now(),
            managerId: managerId,
            client: client,
            phone: phone,
            object: object,
            params: bType + ' (' + w + '×' + l + ' м)',
            price: price,
            date: new Date().toLocaleDateString('ru-RU'),
            status: 'new'
        };

        // Загружаем существующие сделки и добавляем новую
        var allDeals = JSON.parse(localStorage.getItem('mamyr_all_deals')) || [];
        allDeals.push(newDeal);
        localStorage.setItem('mamyr_all_deals', JSON.stringify(allDeals));

        var managerTitle = (managerId === 'manager1') ? 'Менеджеру 1' : 'Менеджеру 2';
        alert('КП успешно сформировано! Сделка сохранена и передана в кабинет ' + managerTitle + '.');
        
        // Перенаправляем в кабинет этого менеджера
        window.location.href = managerId + '.html';
    }
</script>

</body>
</html>
