<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный Кабинет — Менеджер 1</title>
    <style>
        * { box-sizing: border-box; font-family: 'Calibri', 'Arial', sans-serif; }
        body { background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2b6cb0; padding-bottom: 15px; margin-bottom: 25px; }
        .header h1 { color: #1a365d; font-size: 22px; margin: 0; }
        .btn-create { background: #2b6cb0; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; font-size: 14px; }
        .btn-create:hover { background: #2c5282; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #cbd5e0; padding: 12px; text-align: left; font-size: 14px; }
        th { background: #2b6cb0; color: #fff; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        tr:nth-child(even) { background: #f8fafc; }

        select.status-select { padding: 6px 10px; border-radius: 4px; border: 1px solid #cbd5e0; font-size: 13px; font-weight: bold; }
        .status-new { background: #ebf8ff; color: #2b6cb0; }
        .status-work { background: #feebc8; color: #c05621; }
        .status-success { background: #c6f6d5; color: #22543d; }
        .status-cancel { background: #fed7d7; color: #9b2c2c; }
        
        .empty-text { text-align: center; color: #718096; padding: 30px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Кабинет управления сделками: Менеджер 1</h1>
        <a href="manager.html" class="btn-create">+ Сформировать новое КП</a>
    </div>

    <div id="tableContainer"></div>
</div>

<script>
    var CURRENT_ROLE = "Менеджер 1"; // Отфильтрует КП именно для Менеджера 1

    function loadDeals() {
        var allDeals = JSON.parse(localStorage.getItem('mamyr_kp_history')) || [];
        
        // Фильтруем сделки по автору/ответственному
        var myDeals = allDeals.filter(function(deal) {
            return deal.manager === CURRENT_ROLE || deal.managerId === "manager1";
        });

        var container = document.getElementById('tableContainer');

        if (myDeals.length === 0) {
            container.innerHTML = '<div class="empty-text">У вас пока нет оформленных коммерческих предложений.</div>';
            return;
        }

        var html = '<table><thead><tr>' +
            '<th>Дата</th>' +
            '<th>Заказчик</th>' +
            '<th>Назначение / Обьект</th>' +
            '<th>Габариты</th>' +
            '<th>Сумма КП</th>' +
            '<th>Статус сделки</th>' +
            '</tr></thead><tbody>';

        myDeals.forEach(function(deal, idx) {
            html += '<tr>' +
                '<td>' + (deal.date || '-') + '</td>' +
                '<td><b>' + (deal.client || 'ТОО «Мамыр»') + '</b></td>' +
                '<td>' + (deal.object || 'Ангар') + '</td>' +
                '<td>' + (deal.size || '-') + '</td>' +
                '<td><b>' + (deal.price || '-') + '</b></td>' +
                '<td>' +
                    '<select class="status-select ' + getStatusClass(deal.status) + '" onchange="updateStatus(' + deal.id + ', this.value)">' +
                        '<option value="new"' + (deal.status === 'new' ? ' selected' : '') + '>Новая заявка</option>' +
                        '<option value="work"' + (deal.status === 'work' ? ' selected' : '') + '>В работе / КП отправлено</option>' +
                        '<option value="success"' + (deal.status === 'success' ? ' selected' : '') + '>Договор / Предоплата</option>' +
                        '<option value="cancel"' + (deal.status === 'cancel' ? ' selected' : '') + '>Отказ</option>' +
                    '</select>' +
                '</td>' +
            '</tr>';
        });

        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function updateStatus(dealId, newStatus) {
        var allDeals = JSON.parse(localStorage.getItem('mamyr_kp_history')) || [];
        allDeals.forEach(function(deal) {
            if (deal.id === dealId) {
                deal.status = newStatus;
            }
        });
        localStorage.setItem('mamyr_kp_history', JSON.stringify(allDeals));
        loadDeals();
    }

    function getStatusClass(status) {
        if (status === 'new') return 'status-new';
        if (status === 'work') return 'status-work';
        if (status === 'success') return 'status-success';
        if (status === 'cancel') return 'status-cancel';
        return 'status-new';
    }

    window.onload = loadDeals;
</script>

</body>
</html>
