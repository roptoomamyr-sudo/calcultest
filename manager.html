<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор и генератор КП — ТОО «Мамыр»</title>
    <style>
        * { box-sizing: border-box; font-family: 'Calibri', 'Arial', sans-serif; }
        body { background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #1a365d; font-size: 24px; border-bottom: 2px solid #2b6cb0; padding-bottom: 10px; margin-top: 0; }
        
        .form-section { background: #f8fafc; border: 1px solid #cbd5e0; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .form-section h3 { margin-top: 0; color: #2b6cb0; font-size: 16px; margin-bottom: 15px; }
        
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 200px; }
        .form-group label { display: block; font-weight: bold; font-size: 13px; color: #2d3748; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e0; font-size: 14px; background: #fff; }

        .total-box { background: #edf2f7; padding: 15px 20px; border-radius: 8px; font-size: 18px; font-weight: bold; color: #1a365d; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .btn-submit { background: #276749; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        .btn-submit:hover { background: #22543d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Формирование коммерческого предложения — ТОО «Мамыр»</h1>

    <div class="form-section">
        <h3>1. Данные менеджера и заказчика</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Менеджер:</label>
                <select id="managerName">
                    <option value="Менеджер 1">Менеджер 1</option>
                    <option value="Менеджер 2">Менеджер 2</option>
                    <option value="Менеджер 3">Менеджер 3</option>
                    <option value="Руководитель отдела">Руководитель отдела продаж</option>
                    <option value="Директор">Директор</option>
                </select>
            </div>
            <div class="form-group">
                <label>Заказчик (Клиент / ТОО):</label>
                <input type="text" id="clientName" placeholder="Введите название клиента...">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Телефон:</label>
                <input type="text" id="clientPhone" placeholder="+7 (...) ...-.." value="+7 700 000 00 00">
            </div>
            <div class="form-group">
                <label>WhatsApp:</label>
                <input type="text" id="clientWhatsapp" placeholder="+7 (...) ...-.." value="+7 700 000 00 00">
            </div>
        </div>
    </div>

    <div class="form-section">
        <h3>2. Параметры объекта и покрытия</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Назначение объекта:</label>
                <select id="purpose">
                    <option value="Ангар универсальный">Ангар универсальный</option>
                    <option value="Зернохранилище">Зернохранилище</option>
                    <option value="Животноводческий комплекс">Животноводческий комплекс</option>
                    <option value="Склад">Склад</option>
                    <option value="Спортивная арена">Спортивная арена</option>
                </select>
            </div>
            <div class="form-group">
                <label>Тип покрытия:</label>
                <select id="coverType" onchange="calculateTotal()">
                    <option value="tent">Тентовый (ПВХ)</option>
                    <option value="profist">Профлист</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Ширина (м):</label>
                <input type="number" id="width" value="20" oninput="calculateTotal()">
            </div>
            <div class="form-group">
                <label>Длина (м):</label>
                <input type="number" id="length" value="80" oninput="calculateTotal()">
            </div>
            <div class="form-group">
                <label>Высота (м):</label>
                <input type="number" id="height" value="6" oninput="calculateTotal()">
            </div>
        </div>
    </div>

    <div class="form-section">
        <h3>3. Стоимость элементов (Ангар, Ворота, Доставка, Монтаж)</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Стоимость ангара (базовая, ₸):</label>
                <input type="number" id="baseHangarPrice" value="25000000" oninput="calculateTotal()">
            </div>
            <div class="form-group">
                <label>Стоимость ворот (₸):</label>
                <input type="number" id="gatesPrice" value="1500000" oninput="calculateTotal()">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Расстояние доставки (км):</label>
                <input type="number" id="distance" value="350" oninput="calculateTotal()">
            </div>
            <div class="form-group">
                <label>Ставка за 1 км за 1 машину (₸):</label>
                <input type="number" id="ratePerKm" value="500" oninput="calculateTotal()">
            </div>
            <div class="form-group">
                <label>Количество рейсов (машин):</label>
                <input type="number" id="truckCount" value="3" min="1" oninput="calculateTotal()">
            </div>
        </div>
    </div>

    <div class="form-section">
        <h3>4. Сроки выполнения работ</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Срок изготовления:</label>
                <input type="text" id="termManufacture" value="от 20 рабочих дней">
            </div>
            <div class="form-group">
                <label>Срок монтажных работ:</label>
                <input type="text" id="termInstallation" value="от 10 рабочих дней">
            </div>
            <div class="form-group">
                <label>Срок фундаментных работ:</label>
                <input type="text" id="termFoundation" value="по согласованию">
            </div>
        </div>
    </div>

    <div class="total-box">
        <span>Итоговая стоимость КП:</span>
        <span id="totalFinalDisplay">0 ₸</span>
    </div>

    <button class="btn-submit" onclick="generateAndSaveKP()">Сформировать КП и сохранить в реестр</button>
</div>

<script>
    function calculateTotal() {
        var baseHangar = parseFloat(document.getElementById('baseHangarPrice').value) || 0;
        var gates = parseFloat(document.getElementById('gatesPrice').value) || 0;
        var hangarAndGates = baseHangar + gates;

        // Монтаж: 21% для тента, 23% для профлиста от (Ангар + Ворота)
        var coverType = document.getElementById('coverType').value;
        var installationPercent = (coverType === 'profist') ? 0.23 : 0.21;
        var installation = hangarAndGates * installationPercent;

        // Доставка: расстояние * ставка * количество рейсов (машин)
        var distance = parseFloat(document.getElementById('distance').value) || 0;
        var ratePerKm = parseFloat(document.getElementById('ratePerKm').value) || 0;
        var truckCount = parseInt(document.getElementById('truckCount').value) || 1;
        var delivery = distance * ratePerKm * truckCount;

        var total = hangarAndGates + installation + delivery;

        document.getElementById('totalFinalDisplay').innerText = total.toLocaleString('ru-RU') + ' ₸';
        return total;
    }

    function generateAndSaveKP() {
        var manager = document.getElementById('managerName').value;
        var client = document.getElementById('clientName').value.trim() || 'Заказчик';
        var phone = document.getElementById('clientPhone').value;
        var whatsapp = document.getElementById('clientWhatsapp').value;
        
        var purpose = document.getElementById('purpose').value;
        var width = document.getElementById('width').value;
        var length = document.getElementById('length').value;
        var height = document.getElementById('height').value;
        
        var dimensionsText = width + 'x' + length + (height ? 'x' + height : '') + 'м';
        var fullObjectInfo = purpose + ' (' + dimensionsText + ')';
        
        var totalFinal = calculateTotal();
        var totalFinalFormatted = totalFinal.toLocaleString('ru-RU') + ' ₸';

        // Считываем введенные сроки
        var termMan = document.getElementById('termManufacture').value;
        var termInst = document.getElementById('termInstallation').value;
        var termFound = document.getElementById('termFoundation').value;
        var trucks = document.getElementById('truckCount').value;

        // Сохранение в localStorage для реестра
        var history = JSON.parse(localStorage.getItem('mamyr_kp_history')) || [];
        
        var newDeal = {
            id: Date.now(),
            manager: manager,
            client: client,
            phone: phone,
            whatsapp: whatsapp,
            object: fullObjectInfo,
            price: totalFinalFormatted,
            status: 'sent',
            date: new Date().toLocaleDateString('ru-RU'),
            terms: {
                manufacture: termMan,
                installation: termInst,
                foundation: termFound,
                truckCount: trucks
            },
            history: []
        };

        history.push(newDeal);
        localStorage.setItem('mamyr_kp_history', JSON.stringify(history));

        alert('Коммерческое предложение успешно сформировано и сохранено в реестр!');
        
        // Опционально: перенаправление в реестр
        // window.location.href = 'registry.html';
    }

    window.onload = calculateTotal;
</script>
</body>
</html>
