<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель и Мониторинг ссылок</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; width: 100%; max-width: 700px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2, h3 { margin-top: 0; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #444; }
        input, select { width: 100%; padding: 11px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; }
        button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .result-box { margin-top: 15px; padding: 15px; background: #eef7ee; border: 1px solid #c3e6cb; border-radius: 8px; display: none; }
        .url-text { font-family: monospace; font-size: 13px; word-break: break-all; margin-top: 5px; color: #007bff; font-weight: bold; background: #fff; padding: 8px; border-radius: 6px; border: 1px solid #dcdcdc; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 10px; border: 1px solid #e0e0e0; text-align: left; }
        th { background-color: #f8f9fa; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; display: inline-block; }
        .badge-new { background: #d4edda; color: #155724; }
        .badge-used { background: #f8d7da; color: #721c24; }
        .badge-expired { background: #fff3cd; color: #856404; }
        .refresh-btn { background: #6c757d; width: auto; padding: 8px 15px; font-size: 14px; }
        .reset-btn { background: #dc3545; width: auto; padding: 8px 15px; font-size: 14px; margin-left: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🧪 Генератор одноразовых ссылок</h2>

    <div class="form-group">
        <label for="clientName">Имя клиента / Организация:</label>
        <input type="text" id="clientName" placeholder="Например: Иван (ООО Вектор)">
    </div>

    <div class="form-group">
        <label for="ttlSelect">Срок действия ссылки:</label>
        <select id="ttlSelect">
            <option value="12" selected>12 часов (По умолчанию)</option>
            <option value="1">1 час</option>
            <option value="24">24 часа</option>
            <option value="48">48 часов</option>
        </select>
    </div>

    <button id="genBtn">Сформировать ссылку</button>
    <div id="status" style="margin-top:10px; text-align:center; font-weight:bold;"></div>

    <div class="result-box" id="resultBox">
        <label>Готовая защищенная ссылка для клиента:</label>
        <div class="url-text" id="genUrl"></div>
    </div>
</div>

<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <h3 style="margin: 0;">📊 Мониторинг всех ссылок</h3>
        <div>
            <button class="refresh-btn" id="refreshBtn">🔄 Обновить</button>
            <button class="reset-btn" id="resetBtn">🗑️ Инициализировать базу</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Клиент</th>
                <th>Статус</th>
                <th>Создано</th>
                <th>Просмотрено</th>
            </tr>
        </thead>
        <tbody id="statsTableBody">
            <tr><td colspan="4" style="text-align:center;">Загрузка данных...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const BIN_ID = "6ac861c6ffd5d160535b0623";
    const SECRET_KEY = "$2a$10$IMgqPeq6EGMUWkoPpesa5.NXtCKi6SpV9oE.H/hRWRVC9gheuz1WO";
    const BASE_URL = "https://roptoomamyr-sudo.github.io/calcultest/";

    function formatDate(time) {
        if (!time) return '—';
        const d = new Date(time);
        return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
    }

    function loadStats() {
        const tbody = document.getElementById('statsTableBody');
        
        fetch(https://api.jsonbin.io/v3/b/${BIN_ID}/latest, {
            headers: { "X-Master-Key": SECRET_KEY }
        })
        .then(res => res.json())
        .then(data => {
            let db = data.record;
            if (Array.isArray(db)) db = db[0] || {};
            if (typeof db !== 'object' || db === null) db = {};

            tbody.innerHTML = '';

            const keys = Object.keys(db).filter(k => k.startsWith('id_')).reverse();

            if (keys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Ссылок пока нет</td></tr>';
                return;
            }

            const now = Date.now();

            keys.forEach(key => {
                const item = db[key];
                if (!item) return;

                let statusBadge = '';

                if (item.used) {
                    statusBadge = '<span class="badge badge-used">🔴 Просмотрено</span>';
                } else if (item.expiresAt && now > item.expiresAt) {
                    statusBadge = '<span class="badge badge-expired">⏳ Истекла</span>';
                } else {
                    statusBadge = '<span class="badge badge-new">🟢 Не открыта</span>';
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${item.client || 'Без имени'}</b></td>
                    <td>${statusBadge}</td>
                    <td>${formatDate(item.createdAt)}</td>
                    <td>${formatDate(item.firstOpenedAt)}</td>
                `;
                tbody.appendChild(tr);
            });
        })
        .catch(err => {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">Ошибка загрузки данных</td></tr>';
        });
    }

    document.getElementById('genBtn').addEventListener('click', function() {
        const clientName = document.getElementById('clientName').value.trim();
        const ttlHours = parseInt(document.getElementById('ttlSelect').value);
        const status = document.getElementById('status');
        const btn = this;

        if (!clientName) { alert("Введите имя клиента!"); return; }

        btn.disabled = true;
        status.innerText = "Создание ссылки...";

        fetch(https://api.jsonbin.io/v3/b/${BIN_ID}/latest, {
            headers: { "X-Master-Key": SECRET_KEY }
        })
        .then(res => res.json())
        .then(data => {
            let db = data.record;
            if (Array.isArray(db)) db = db[0] || {};
            if (typeof db !== 'object' || db === null) db = {};

            const linkId = "id_" + Date.now();
            const now = Date.now();

            db[linkId] = {
                client: clientName,
                used: false,
                createdAt: now,
                expiresAt: now + (ttlHours * 60 * 60 * 1000),
                firstOpenedAt: null,
                deviceLock: null
            };

            return fetch(https://api.jsonbin.io/v3/b/${BIN_ID}, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "X-Master-Key": SECRET_KEY },
                body: JSON.stringify(db)
            }).then(() => linkId);
        })
        .then(linkId => {
            btn.disabled = false;
            status.innerText = "";
            const fullUrl = ${BASE_URL}?client=${encodeURIComponent(clientName)}&id=${linkId};
            document.getElementById('genUrl').innerText = fullUrl;
            document.getElementById('resultBox').style.display = "block";
            loadStats();
        })
        .catch(err => {
            btn.disabled = false;
            status.innerText = "Ошибка: " + err.message;
        });
    });

    document.getElementById('resetBtn').addEventListener('click', function() {
        if (!confirm("Вы уверены, что хотите очистить и инициализировать базу заново?")) return;
        
        fetch(https://api.jsonbin.io/v3/b/${BIN_ID}, {
            method: "PUT",
            headers: { "Content-Type": "application/json", "X-Master-Key": SECRET_KEY },
            body: JSON.stringify({ init: true })
        })
        .then(() => {
            alert("База данных успешно очищена!");
            loadStats();
        });
    });

    document.getElementById('refreshBtn').addEventListener('click', loadStats);
    loadStats();
</script>

</body>
</html>
