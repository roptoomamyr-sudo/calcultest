<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор КМ и Спецификации — ТОО «Мамыр»</title>
    <style>
        * { box-sizing: border-box; font-family: 'Calibri', 'Arial', sans-serif; }
        body { background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #1a365d; font-size: 22px; margin-top: 0; border-bottom: 2px solid #2b6cb0; padding-bottom: 10px; }
        
        .panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 25px; }
        .control-group label { display: block; font-weight: bold; font-size: 13px; color: #2d3748; margin-bottom: 6px; }
        .control-group select, .control-group input { width: 100%; padding: 9px 12px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 6px; background: #fff; }
        
        .btn { background: #2b6cb0; color: #fff; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; grid-column: 1 / -1; width: 100%; transition: background 0.2s; }
        .btn:hover { background: #2c5282; }

        .section-title { font-size: 18px; color: #2b6cb0; margin-top: 30px; margin-bottom: 15px; font-weight: bold; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 20px; }
        th, td { border: 1px solid #cbd5e0; padding: 10px 12px; text-align: left; font-size: 14px; }
        th { background: #2b6cb0; color: #fff; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        tr:nth-child(even) { background: #f8fafc; }

        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-top: 25px; }
        .summary-card { background: #ebf8ff; border: 1px solid #bee3f8; border-radius: 8px; padding: 18px; text-align: center; }
        .summary-card h4 { margin: 0 0 8px 0; font-size: 13px; color: #2b6cb0; text-transform: uppercase; }
        .summary-card .val { font-size: 22px; font-weight: bold; color: #1a365d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Калькулятор КМ и Спецификаций (Ангар 12 м, Болтовое соединение)</h1>

    <div class="panel">
        <div class="control-group">
            <label for="hangarType">Тип ангара:</label>
            <select id="hangarType" onchange="calculateKM()">
                <option value="arch">Чисто арочный (Высота 5.5 м)</option>
                <option value="straight">Прямостенный арочный (Стена 3м, Общ. 6.8м)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="hangarLength">Длина ангара (м):</label>
            <input type="number" id="hangarLength" value="30" step="3" min="6" onchange="calculateKM()">
        </div>
        <div class="control-group">
            <label for="gateSize">Торцевые ворота:</label>
            <select id="gateSize" onchange="calculateKM()">
                <option value="4x4">Ворота 4.0 х 4.0 м</option>
                <option value="3x3">Ворота 3.0 х 3.0 м</option>
                <option value="none">Без ворот</option>
            </select>
        </div>
        <button class="btn" onclick="calculateKM()">Рассчитать спецификацию и материалы</button>
    </div>

    <div class="section-title">1. Спецификация металлопроката на весь ангар</div>
    <div id="metalTableContainer"></div>

    <div class="section-title">2. Ведомость метизов и крепежа</div>
    <div id="boltsTableContainer"></div>

    <div class="section-title">3. Расчет ПВХ-тента (покрытие)</div>
    <div id="tentTableContainer"></div>

    <div class="summary-grid">
        <div class="summary-card">
            <h4>Общий метраж труб</h4>
            <div class="val" id="totalMeters">0 м</div>
        </div>
        <div class="summary-card">
            <h4>Расчетный вес каркаса</h4>
            <div class="val" id="totalWeight">0 кг</div>
        </div>
        <div class="summary-card">
            <h4>Площадь ПВХ-тента</h4>
            <div class="val" id="totalTent">0 м²</div>
        </div>
    </div>
</div>

<script>
    var W_60_60_3 = 5.22; // кг/м
    var W_60_40_3 = 4.25; // кг/м

    function calculateKM() {
        var type = document.getElementById('hangarType').value;
        var length = parseFloat(document.getElementById('hangarLength').value) || 30;
        var gate = document.getElementById('gateSize').value;

        var step = 3.0; // Шаг каркаса 3 метра
        var bays = Math.round(length / step);
        var archesCount = bays + 1; 

        // Геометрия дуг
        var arcOuterLen = (type === 'arch') ? 18.8 : 21.4; 
        var arcInnerLen = arcOuterLen - 0.8; 

        var pipe6060_per_arch = arcOuterLen + (type === 'straight' ? 6.0 : 0); 
        var pipe6040_per_arch = arcInnerLen;
        var connectors_per_arch = 15.0; 

        var totalArch6060 = pipe6060_per_arch * archesCount;
        var totalArch6040 = pipe6040_per_arch * archesCount;
        var totalArchConnectors = connectors_per_arch * archesCount;

        // Прогоны: 3 для арочного, 5 для прямостенного
        var stringerLines = (type === 'arch') ? 3 : 5;
        var totalStringers = length * stringerLines;

        var endWallPipes = (gate !== 'none') ? 45.0 : 30.0;

        var sum6060 = totalArch6060 + totalStringers + endWallPipes + totalArchConnectors;
        var sum6040 = totalArch6040;

        var weight6060 = sum6060 * W_60_60_3;
        var weight6040 = sum6040 * W_60_40_3;
        var totalWeightKg = Math.round(weight6060 + weight6040);

        var totalBolts = archesCount * (type === 'arch' ? 25 : 30); 

        // --- РАСЧЕТ ПВХ ТЕНТА ---
        // Площадь основного ската = Длина * Длина дуги (с запасом на подвороты ~5%)
        var roofTentArea = length * arcOuterLen * 1.05;
        
        // Площадь торцов (два торца)
        // Площадь одного торца при ширине 12м:
        // Арочный: примерно 0.65 * Ширина * Высота = 0.65 * 12 * 5.5 ≈ 43 м2 на торец
        // Прямостенный: прямоугольник 12х3 + арка сверху ≈ 36 + 30 = 66 м2 на торец
        var singleEndArea = (type === 'arch') ? 43.0 : 66.0;
        var totalEndsArea = singleEndArea * 2;

        // Вычет под ворота
        var gateArea = 0;
        if (gate === '4x4') gateArea = 16.0;
        if (gate === '3x3') gateArea = 9.0;
        
        var netTentArea = Math.round(roofTentArea + totalEndsArea - gateArea);

        // --- ТАБЛИЦА МЕТАЛЛА ---
        var metalHtml = '<table><thead><tr>' +
            '<th>№</th><th>Наименование элемента</th><th>Профиль / Сечение</th><th>Количество</th><th>Ед. изм.</th><th>Метраж</th>' +
            '</tr></thead><tbody>' +
            '<tr><td>1</td><td><b>Дуги внешние (арки)</b></td><td>Труба 60×60×3</td><td>' + archesCount + '</td><td>шт.</td><td>' + Math.round(totalArch6060) + ' м</td></tr>' +
            '<tr><td>2</td><td><b>Дуги внутренние</b></td><td>Труба 60×40×3</td><td>' + archesCount + '</td><td>шт.</td><td>' + Math.round(totalArch6040) + ' м</td></tr>' +
            '<tr><td>3</td><td><b>Прогоны продольные</b></td><td>Труба 60×60×3</td><td>' + stringerLines + ' линий</td><td>п.м.</td><td>' + Math.round(totalStringers) + ' м</td></tr>' +
            '<tr><td>4</td><td><b>Торцевые стойки и обвязка ворот</b></td><td>Труба 60×60×3</td><td>Комплект</td><td>компл.</td><td>' + Math.round(endWallPipes) + ' м</td></tr>' +
            '<tr><td>5</td><td><b>Перемычки каркаса (между дугами)</b></td><td>Труба 60×40×3 / 60×60×3</td><td>Комплект</td><td>компл.</td><td>' + Math.round(totalArchConnectors) + ' м</td></tr>' +
            '</tbody></table>';
        document.getElementById('metalTableContainer').innerHTML = metalHtml;

        // --- ТАБЛИЦА МЕТИЗОВ ---
        var boltsHtml = '<table><thead><tr>' +
            '<th>Наименование метиза</th><th>Класс прочности</th><th>Количество</th><th>Ед. изм.</th>' +
            '</tr></thead><tbody>' +
            '<tr><td>Болт оцинкованный (с гайкой и шайбами)</td><td>8.8</td><td>' + totalBolts + '</td><td>шт.</td></tr>' +
            '<tr><td>Анкерные болты крепления базы к фундаменту</td><td>8.8</td><td>' + (archesCount * 4) + '</td><td>шт.</td></tr>' +
            '</tbody></table>';
        document.getElementById('boltsTableContainer').innerHTML = boltsHtml;

        // --- ТАБЛИЦА ТЕНТА ---
        var tentHtml = '<table><thead><tr>' +
            '<th>Наименование элемента покрытия</th><th>Параметры / Плотность</th><th>Площадь с учетом раскроя</th><th>Ед. изм.</th>' +
            '</tr></thead><tbody>' +
            '<tr><td><b>Основной тент (кровля / стены)</b></td><td>ПВХ ткань (от 650 до 900 г/м²)</td><td>' + Math.round(roofTentArea) + '</td><td>м²</td></tr>' +
            '<tr><td><b>Торцевые части (2 шт.)</b></td><td>ПВХ ткань в цвет ангара</td><td>' + Math.round(totalEndsArea - gateArea) + '</td><td>м² (с учетом проема ворот)</td></tr>' +
            '<tr><td><b>Итого чистая площадь покрытия ПВХ</b></td><td>С учетом технических нахлестов и крепежа</td><td><b>' + netTentArea + '</b></td><td><b>м²</b></td></tr>' +
            '</tbody></table>';
        document.getElementById('tentTableContainer').innerHTML = tentHtml;

        // Итоги в плашках
        document.getElementById('totalMeters').innerText = Math.round(sum6060 + sum6040) + " м";
        document.getElementById('totalWeight').innerText = totalWeightKg.toLocaleString('ru-RU') + " кг (" + (totalWeightKg / 1000).toFixed(2) + " т)";
        document.getElementById('totalTent').innerText = netTentArea.toLocaleString('ru-RU') + " м²";
    }

    calculateKM();
</script>

</body>
</html>
