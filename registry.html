<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Реестр коммерческих предложений — ТОО «Мамыр»</title>
    <style>
        * { box-sizing: border-box; font-family: 'Calibri', 'Arial', sans-serif; }
        body { background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2b6cb0; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { color: #1a365d; font-size: 22px; margin: 0; }
        
        /* Панель фильтров и статистики */
        .toolbar { display: flex; justify-content: space-between; align-items: center; background: #edf2f7; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .filter-group { display: flex; align-items: center; gap: 10px; }
        .filter-group label { font-weight: bold; color: #2d3748; font-size: 14px; }
        .filter-group select { padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e0; font-size: 14px; font-weight: bold; background: #fff; }

        .stats-info { font-size: 14px; color: #4a5568; }
        .stats-info b { color: #2b6cb0; font-size: 16px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #cbd5e0; padding: 10px 12px; text-align: left; font-size: 13px; vertical-align: middle; }
        th { background: #1a365d; color: #fff; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        tr:nth-child(even) { background: #f8fafc; }

        /* Кликабельный заказчик */
        .client-link { color: #2b6cb0; text-decoration: underline; cursor: pointer; font-weight: bold; }
        .client-link:hover { color: #1a365d; }

        /* Бейджи статусов */
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 12px; text-align: center; width: 100%; }
        .status-sent { background: #ebf8ff; color: #2b6cb0; }
        .status-pause { background: #edf2f7; color: #4a5568; }
        .status-expensive { background: #feebc8; color: #c05621; }
        .status-discount { background: #fffaf0; color: #dd6b20; }
        .status-competitor { background: #fed7d7; color: #9b2c2c; }
        .status-nosignal { background: #edf2f7; color: #718096; }
        .status-ready { background: #ebf8ff; color: #3182ce; }
        .status-contract { background: #faf5ff; color: #6b46c1; }
        .status-success { background: #c6f6d5; color: #22543d; }

        /* Модальное окно истории */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: #fff; border-radius: 10px; padding: 25px; width: 480px; max-width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-header h3 { margin: 0; color: #1a365d; font-size: 18px; }
        .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #a0aec0; }
        .history-list { font-size: 13px; color: #4a5568; line-height: 1.6; max-height: 250px; overflow-y: auto; }
        .empty-text { text-align: center; color: #718096; padding: 30px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Общий реестр коммерческих предложений</h1>
        <button onclick="loadRegistry()" style="background: #2b6cb0; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">Обновить</button>
    </div>

    <!-- Панель управления -->
    <div class="toolbar">
        <div class="filter-group">
            <label for="managerFilter">Фильтр по сотруднику:</label>
            <select id="managerFilter" onchange="loadRegistry()">
                <option value="ALL">-- Все сотрудники --</option>
                <option value="Менеджер 1">Менеджер 1</option>
                <option value="Менеджер 2">Менеджер 2</option>
                <option value="Менеджер 3">Менеджер 3</option>
                <option value="Руководитель отдела">Руководитель отдела продаж</option>
                <option value="Директор">Директор</option>
            </select>
        </div>
        <div class="stats-info">
            Всего КП: <b id="totalCount">0</b> шт. | Сумма: <b id="totalSum">0 ₸</b>
        </div>
    </div>

    <div id="tableContainer"></div>
</div>

<!-- Модальное окно истории -->
<div class="modal-overlay" id="historyModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalClientTitle">История сделки</h3>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="history-list" id="modalHistoryContent"></div>
    </div>
</div>

<script>
    var statusNames = {
        'sent': 'Отправил КП',
        'pause': 'Клиент взял паузу',
        'expensive': 'Дорого',
        'discount': 'Просит скидку',
        'competitor': 'У конкурентов дешевле',
        'nosignal': 'Не берет трубку',
        'ready': 'Готов контрактоваться',
        'contract': 'Делаем договор',
        'success': 'Внес предоплату',
        'new': 'Новая заявка'
    };

    function loadRegistry() {
        var filterRole = document.getElementById('managerFilter').value;
        var allDeals = JSON.parse(localStorage.getItem('mamyr_kp_history')) || [];
        
        var filteredDeals = allDeals.filter(function(deal) {
            if (filterRole === 'ALL') return true;
            return deal.manager && deal.manager.indexOf(filterRole) !== -1;
        });

        var container = document.getElementById('tableContainer');
        var totalCount = filteredDeals.length;
        var totalSumNumber = 0;

        filteredDeals.forEach(function(deal) {
            if (deal.price) {
                var cleanNum = parseInt(String(deal.price).replace(/\D/g, ''));
                if (!isNaN(cleanNum)) totalSumNumber += cleanNum;
            }
        });

        document.getElementById('totalCount').innerText = totalCount;
        document.getElementById('totalSum').innerText = totalSumNumber.toLocaleString('ru-RU') + ' ₸';

        if (totalCount === 0) {
            container.innerHTML = '<div class="empty-text">Сделок по выбранному критерию не найдено.</div>';
            return;
        }

        var html = '<table><thead><tr>' +
            '<th>Менеджер</th>' +
            '<th>Заказчик</th>' +
            '<th>Телефон</th>' +
            '<th>WhatsApp</th>' +
            '<th>Объект / Габариты</th>' +
            '<th>Сумма КП</th>' +
            '<th>Статус</th>' +
            '</tr></thead><tbody>';

        filteredDeals.forEach(function(deal) {
            var currentStatus = deal.status || 'sent';
            var statusLabel = statusNames[currentStatus] || currentStatus;

            html += '<tr>' +
                '<td><b>' + (deal.manager || 'Не указан') + '</b></td>' +
                '<td><span class="client-link" onclick="openHistory(' + deal.id + ')">' + (deal.client || 'Заказчик') + ' ℹ️</span></td>' +
                '<td>' + (deal.phone || '-') + '</td>' +
                '<td>' + (deal.whatsapp || '-') + '</td>' +
                '<td>' + (deal.object || 'Ангар') + '</td>' +
                '<td><b>' + (deal.price || '-') + '</b></td>' +
                '<td><span class="status-badge ' + getStatusClass(currentStatus) + '">' + statusLabel + '</span></td>' +
            '</tr>';
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function openHistory(dealId) {
        var allDeals = JSON.parse(localStorage.getItem('mamyr_kp_history')) || [];
        var deal = allDeals.find(function(d) { return d.id === dealId; });
        if (!deal) return;

        document.getElementById('modalClientTitle').innerText = deal.client || 'Заказчик';
        
        var historyHtml = '';
        if (deal.history && deal.history.length > 0) {
            historyHtml = '<ol type="1" style="padding-left:20px; margin:0;"><li>' + deal.history.join('</li><li>') + '</li></ol>';
        } else {
            historyHtml = '• ' + (deal.date || '-') + ' — Создано КП (' + (statusNames[deal.status] || 'Отправил КП') + ')';
        }

        document.getElementById('modalHistoryContent').innerHTML = historyHtml;
        document.getElementById('historyModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('historyModal').style.display = 'none';
    }

    function getStatusClass(status) {
        switch(status) {
            case 'sent': return 'status-sent';
            case 'pause': return 'status-pause';
            case 'expensive': return 'status-expensive';
            case 'discount': return 'status-discount';
            case 'competitor': return 'status-competitor';
            case 'nosignal': return 'status-nosignal';
            case 'ready': return 'status-ready';
            case 'contract': return 'status-contract';
            case 'success': return 'status-success';
            default: return 'status-sent';
        }
    }

    window.onload = loadRegistry;
</script>
</body>
</html>
