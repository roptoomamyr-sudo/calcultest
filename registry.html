<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Общий реестр и история сделок — ТОО «Мамыр»</title>
    <style>
        * { box-sizing: border-box; font-family: 'Calibri', 'Arial', sans-serif; }
        body { background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1350px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2b6cb0; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { color: #1a365d; font-size: 22px; margin: 0; }
        
        .stats-box { background: #e2e8f0; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .stats-box span { font-size: 15px; color: #2d3748; font-weight: bold; }
        .stats-box b { font-size: 18px; color: #2b6cb0; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #cbd5e0; padding: 10px 12px; text-align: left; font-size: 13px; vertical-align: top; }
        th { background: #1a365d; color: #fff; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        tr:nth-child(even) { background: #f8fafc; }

        /* Бейдж текущего статуса (только для просмотра руководителем) */
        .status-badge { display: inline-block; padding: 6px 10px; border-radius: 6px; font-weight: bold; font-size: 12px; margin-bottom: 6px; }
        .status-sent { background: #ebf8ff; color: #2b6cb0; }
        .status-pause { background: #edf2f7; color: #4a5568; }
        .status-expensive { background: #feebc8; color: #c05621; }
        .status-discount { background: #fffaf0; color: #dd6b20; }
        .status-competitor { background: #fed7d7; color: #9b2c2c; }
        .status-nosignal { background: #edf2f7; color: #718096; }
        .status-ready { background: #ebf8ff; color: #3182ce; }
        .status-contract { background: #faf5ff; color: #6b46c1; }
        .status-success { background: #c6f6d5; color: #22543d; }

        /* История изменений */
        .history-log { font-size: 11px; color: #4a5568; line-height: 1.4; border-top: 1px dashed #cbd5e0; padding-top: 6px; margin-top: 6px; background: #fff; padding: 4px; border-radius: 4px; }
        .empty-text { text-align: center; color: #718096; padding: 30px; font-style: italic; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Общий реестр КП и история работы менеджеров</h1>
        <button onclick="loadRegistry()" style="background: #2b6cb0; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">Обновить данные</button>
    </div>

    <div class="stats-box">
        <span>Всего сделок в системе: <b id="totalCount">0</b> шт.</span>
        <span>Общая сумма портфеля: <b id="totalSum">0 ₸</b></span>
    </div>

    <div id="tableContainer"></div>
</div>

<script>
    var statusNames = {
        'sent': 'Отправил КП',
        'pause': 'Клиент взял паузу',
        'expensive': 'Дорого',
        'discount': 'Просит скидку',
        'competitor': 'У конкурентов дешевле',
        'nosignal': 'Не берет трубку',
        'ready': 'Готов контрактоваться',
        'contract': 'Делаем договор',
        'success': 'Внес предоплату'
    };

    function loadRegistry() {
        var allDeals = JSON.parse(localStorage.getItem('mamyr_kp_history')) || [];
        var container = document.getElementById('tableContainer');
        
        var totalCount = allDeals.length;
        var totalSumNumber = 0;

        allDeals.forEach(function(deal) {
            if (deal.price) {
                var cleanNum = parseInt(String(deal.price).replace(/\D/g, ''));
                if (!isNaN(cleanNum)) totalSumNumber += cleanNum;
            }
        });

        document.getElementById('totalCount').innerText = totalCount;
        document.getElementById('totalSum').innerText = totalSumNumber.toLocaleString('ru-RU') + ' ₸';

        if (totalCount === 0) {
            container.innerHTML = '<div class="empty-text">В системе пока нет сохраненных сделок.</div>';
            return;
        }

        var html = '<table><thead><tr>' +
            '<th>Дата создания</th>' +
            '<th>Менеджер</th>' +
            '<th>Заказчик / Телефон</th>' +
            '<th>Объект</th>' +
            '<th>Сумма КП</th>' +
            '<th>Текущий статус и история изменений</th>' +
            '</tr></thead><tbody>';

        allDeals.forEach(function(deal) {
            var currentStatus = deal.status || 'sent';
            var statusLabel = statusNames[currentStatus] || currentStatus;
            
            // Собираем историю изменений с датами и временем
            var historyHtml = '';
            if (deal.history && deal.history.length > 0) {
                historyHtml = '<div class="history-log"><b>Хронология работы:</b><br>' + deal.history.join('<br>') + '</div>';
            } else {
                historyHtml = '<div class="history-log"><b>Хронология:</b><br>' + (deal.date || '-') + ' — Создано КП (Отправил КП)</div>';
            }

            html += '<tr>' +
                '<td>' + (deal.date || '-') + '</td>' +
                '<td><b>' + (deal.manager || 'Не указан') + '</b></td>' +
                '<td><b>' + (deal.client || 'Заказчик') + '</b><br><small style="color:#718096">' + (deal.phone || '') + '</small></td>' +
                '<td>' + (deal.object || 'Ангар') + '</td>' +
                '<td><b>' + (deal.price || '-') + '</b></td>' +
                '<td>' +
                    '<span class="status-badge ' + getStatusClass(currentStatus) + '">' + statusLabel + '</span>' +
                    historyHtml +
                '</td>' +
            '</tr>';
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function getStatusClass(status) {
        switch(status) {
            case 'sent': return 'status-sent';
            case 'pause': return 'status-pause';
            case 'expensive': return 'status-expensive';
            case 'discount': return 'status-discount';
            case 'competitor': return 'status-competitor';
            case 'nosignal': return 'status-nosignal';
            case 'ready': return 'status-ready';
            case 'contract': return 'status-contract';
            case 'success': return 'status-success';
            default: return 'status-sent';
        }
    }

    window.onload = loadRegistry;
</script>
</body>
</html>
